[package]
name = "bastion-core"
version = "0.1.0"
edition = "2024"
description = "An allocation-free process, resource, and capability policy core"
publish = false
license = "MIT"
repository = "https://github.com/moritayasuaki/bastion"

[lib]
path = "src/lib.rs"

[dependencies]
bastion-policy = { path = "policy" }
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }

[profile.release]
panic = "abort"

[workspace]
members = [".", "policy", "tools/lab", "tools", "tools/integrity"]
exclude = ["boot"]
