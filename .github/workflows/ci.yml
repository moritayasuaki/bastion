name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make xorriso qemu-system-x86 ovmf
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target x86_64-unknown-none
      - name: Install Lean manager
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Proofs, conformance, Rust tests, formatting, and lints
        run: cargo xtask check
      - name: BIOS and UEFI boot checks
        run: |
          cargo xtask build --test
          cargo xtask smoke --memory 64M
          cargo xtask smoke --machine q35 --uefi /usr/share/OVMF/OVMF_CODE_4M.fd --uefi-vars /usr/share/OVMF/OVMF_VARS_4M.fd
      - name: TCP and UDP network checks
        run: |
          cargo xtask build
          cargo xtask network-test
          cargo xtask network-test --uefi /usr/share/OVMF/OVMF_CODE_4M.fd --uefi-vars /usr/share/OVMF/OVMF_VARS_4M.fd
